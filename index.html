    <style>
        /* === Все ваши стили остаются без изменений === */
        :root {
            --bg-primary: linear-gradient(135deg, #FFE4E9 0%, #FFB6C1 100%);
            --bg-secondary: rgba(255, 255, 255, 0.9);
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-overlay: rgba(255, 255, 255, 0.8);
            --text-primary: #5D1F31;
            --text-secondary: #8B475D;
            --text-muted: #A67A87;
            --accent-primary: #FFB6C1;
            --accent-secondary: #FF8FA3;
            --accent-danger: #E57373;
            --accent-warning: #FFB74D;
            --accent-success: #81C784;
            --accent-info: #64B5F6;
            --shadow: 0 8px 32px rgba(255, 182, 193, 0.25);
            --shadow-sm: 0 4px 16px rgba(255, 182, 193, 0.15);
            --shadow-lg: 0 16px 48px rgba(255, 182, 193, 0.35);
            --shadow-inset: inset 0 2px 8px rgba(255, 255, 255, 0.5);
            --border-radius: 24px;
            --border-radius-sm: 16px;
            --border-radius-lg: 32px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.2s ease;
            --transition-slow: all 0.5s ease;
        }

        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #5D1F31 0%, #2A2A2A 100%);
            --bg-secondary: rgba(45, 45, 45, 0.9);
            --bg-card: rgba(45, 45, 45, 0.92);
            --bg-overlay: rgba(0, 0, 0, 0.8);
            --text-primary: #FFE4E9;
            --text-secondary: #FFB6C1;
            --text-muted: #D4A7B5;
            --accent-primary: #8B475D;
            --accent-secondary: #D81B60;
            --accent-danger: #F44336;
            --accent-warning: #FF9800;
            --accent-success: #4CAF50;
            --accent-info: #2196F3;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.4);
            --shadow-inset: inset 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        [data-theme="pink"] {
            --bg-primary: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            --bg-secondary: rgba(255, 255, 255, 0.95);
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-overlay: rgba(255, 255, 255, 0.9);
            --text-primary: #8B0A50;
            --text-secondary: #FF1493;
            --text-muted: #FF69B4;
            --accent-primary: #FF69B4;
            --accent-secondary: #FF1493;
            --accent-danger: #FF416C;
            --accent-warning: #FFD166;
            --accent-success: #06D6A0;
            --accent-info: #118AB2;
            --shadow: 0 8px 32px rgba(255, 105, 180, 0.3);
            --shadow-sm: 0 4px 16px rgba(255, 105, 180, 0.2);
            --shadow-lg: 0 16px 48px rgba(255, 105, 180, 0.4);
            --shadow-inset: inset 0 2px 8px rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 120px;
            transition: var(--transition-slow);
            overflow-x: hidden;
        }

        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .gradient-text {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--accent-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 182, 193, 0.1);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--accent-danger);
            color: white;
        }

        .btn-success {
            background: var(--accent-success);
            color: white;
        }

        .btn-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            color: var(--accent-primary);
            font-size: 20px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .btn-icon:hover {
            background: var(--accent-primary);
            color: white;
            transform: rotate(15deg) scale(1.1);
            box-shadow: var(--shadow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.4s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
        }

        .logo-icon {
            animation: float 3s ease-in-out infinite;
        }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            justify-content: space-around;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.5s ease;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border-radius: 12px;
            min-width: 60px;
        }

        .nav-item.active {
            background: rgba(255, 182, 193, 0.1);
            color: var(--accent-primary);
            transform: translateY(-5px);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
            transition: var(--transition);
        }

        .nav-item.active .nav-icon {
            transform: scale(1.2);
        }

        .nav-label {
            font-size: 11px;
            font-weight: 600;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent-danger);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.4s ease;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .modal-close:hover {
            color: var(--accent-primary);
            transform: rotate(90deg);
        }

        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 182, 193, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 1s ease-in-out infinite;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .service-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .service-card.selected {
            border-color: var(--accent-primary);
            background: rgba(255, 182, 193, 0.1);
        }

        .service-icon {
            font-size: 32px;
            margin-bottom: 10px;
            transition: var(--transition);
            display: block;
        }

        .service-card:hover .service-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255, 182, 193, 0.3);
            border-radius: var(--border-radius-sm);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 16px;
            transition: var(--transition);
            font-family: inherit;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(255, 182, 193, 0.2);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            gap: 6px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.1);
            color: var(--accent-warning);
        }

        .status-confirmed {
            background: rgba(76, 175, 80, 0.1);
            color: var(--accent-success);
        }

        .status-completed {
            background: rgba(33, 150, 243, 0.1);
            color: var(--accent-info);
        }

        .status-cancelled {
            background: rgba(244, 67, 54, 0.1);
            color: var(--accent-danger);
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), transparent);
        }

        .hover-zoom {
            transition: transform 0.3s ease;
        }

        .hover-zoom:hover {
            transform: scale(1.05);
        }

        /* ГАЛЕРЕЯ */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .gallery-item {
            aspect-ratio: 1;
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
        }

        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--accent-danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            z-index: 10;
        }

        .gallery-item:hover .delete-btn {
            display: flex;
        }

        .gallery-item .item-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px;
            font-size: 11px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .gallery-item:hover .item-info {
            transform: translateY(0);
        }

        /* ЗАГРУЗКА ФОТО */
        .upload-container {
            text-align: center;
            padding: 30px;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            border: 2px dashed var(--accent-primary);
            margin: 20px 0;
            cursor: pointer;
            transition: var(--transition);
        }

        .upload-container:hover {
            background: rgba(255, 182, 193, 0.1);
            border-color: var(--accent-secondary);
        }

        .upload-container input[type="file"] {
            display: none;
        }

        .upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 48px;
            color: var(--accent-primary);
        }

        .upload-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .upload-progress {
            width: 100%;
            height: 10px;
            background: var(--bg-secondary);
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .upload-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 0.3s;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
                padding-bottom: 110px;
            }
            
            .service-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .card {
                padding: 20px;
            }
            
            .section-title {
                font-size: 20px;
            }
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-secondary);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-primary);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .theme-toggle {
            position: relative;
            width: 60px;
            height: 30px;
            background: var(--bg-secondary);
            border-radius: 15px;
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-inset);
            transition: var(--transition);
        }

        .theme-toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        [data-theme="light"] .theme-toggle::after {
            content: '☀️';
        }

        [data-theme="dark"] .theme-toggle::after {
            content: '🌙';
            transform: translateX(30px);
        }

        [data-theme="pink"] .theme-toggle::after {
            content: '🌸';
            transform: translateX(30px);
        }
    </style>
</head>

// Инициализация Telegram
async function initTelegram() {
    try {
        if (window.Telegram && Telegram.WebApp) {
            const tg = Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#FFB6C1');
            tg.setBackgroundColor('#FFE4E9');
            
            const user = tg.initDataUnsafe?.user;
            if (user) {
                currentUser = {
                    id: user.id,
                    firstName: user.first_name,
                    lastName: user.last_name || '',
                    username: user.username || '',
                    photoUrl: user.photo_url || '',
                    isPremium: user.is_premium || false
                };
                
                console.log('✅ Telegram user:', currentUser.firstName);
                updateUserUI();
            } else {
                initGuestMode();
            }
        } else {
            initGuestMode();
        }
    } catch (error) {
        console.error('Telegram init error:', error);
        initGuestMode();
    }
}

// ================= БАЗА ДАННЫХ (SUPABASE) =================
class DatabaseService {
    constructor() {
        if (window.supabase && SUPABASE_CONFIG.url && !SUPABASE_CONFIG.url.includes('ваш-id')) {
            try {
                this.supabase = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
                console.log('✅ Supabase client created');
            } catch (error) {
                console.error('❌ Supabase client error:', error);
                this.supabase = null;
            }
        } else {
            console.warn('⚠️ Supabase not configured');
            this.supabase = null;
        }
    }
    
    async isConnected() {
        if (!this.supabase) return false;
        try {
            const { data, error } = await this.supabase.from('services').select('count').limit(1);
            return !error;
        } catch (error) {
            return false;
        }
    }
    
    async saveUser(userData) {
        if (!this.supabase) return { error: 'No database' };
        
        try {
            const { data, error } = await this.supabase
                .from('users')
                .upsert({
                    telegram_id: userData.id.toString(),
                    first_name: userData.firstName,
                    last_name: userData.lastName || '',
                    username: userData.username || '',
                    photo_url: userData.photoUrl || '',
                    is_premium: userData.isPremium || false,
                    last_seen: new Date().toISOString()
                }, { onConflict: 'telegram_id' });
            
            return { data, error };
        } catch (error) {
            console.error('Save user error:', error);
            return { data: null, error };
        }
    }
    
    async createBooking(booking) {
        if (!this.supabase) return { error: 'No database' };
        
        try {
            const { data, error } = await this.supabase
                .from('bookings')
                .insert([{
                    user_id: booking.userId.toString(),
                    user_name: booking.userName,
                    user_info: booking.userInfo,
                    service_id: booking.serviceId,
                    service_name: booking.service,
                    price: booking.price,
                    date: booking.date,
                    time: booking.time + ':00',
                    master: booking.master || '',
                    notes: booking.notes || '',
                    phone: booking.phone,
                    status: 'pending'
                }])
                .select();
            
            return { data, error };
        } catch (error) {
            console.error('Create booking error:', error);
            return { data: null, error };
        }
    }
    
    async getUserBookings(userId) {
        if (!this.supabase) return { data: null, error: 'No database' };
        
        try {
            const { data, error } = await this.supabase
                .from('bookings')
                .select('*')
                .eq('user_id', userId.toString())
                .order('date', { ascending: true });
            
            return { data, error };
        } catch (error) {
            console.error('Get bookings error:', error);
            return { data: null, error };
        }
    }
    
    async getAllBookings() {
        if (!this.supabase) return { data: null, error: 'No database' };
        
        try {
            const { data, error } = await this.supabase
                .from('bookings')
                .select('*')
                .order('date', { ascending: false });
            
            return { data, error };
        } catch (error) {
            console.error('Get all bookings error:', error);
            return { data: null, error };
        }
    }
    
    async getTodayBookings() {
        if (!this.supabase) return { data: null, error: 'No database' };
        
        const today = new Date().toISOString().split('T')[0];
        try {
            const { data, error } = await this.supabase
                .from('bookings')
                .select('*')
                .eq('date', today)
                .order('time', { ascending: true });
            
            return { data, error };
        } catch (error) {
            console.error('Get today bookings error:', error);
            return { data: null, error };
        }
    }
    
    async updateBookingStatus(bookingId, status) {
        if (!this.supabase) return { error: 'No database' };
        
        try {
            const { data, error } = await this.supabase
                .from('bookings')
                .update({ status: status, updated_at: new Date().toISOString() })
                .eq('id', bookingId);
            
            return { data, error };
        } catch (error) {
            console.error('Update booking error:', error);
            return { data: null, error };
        }
    }
    
    async getServices() {
        if (!this.supabase) return { data: null, error: 'No database' };
        
        try {
            const { data, error } = await this.supabase
                .from('services')
                .select('*')
                .order('price', { ascending: true });
            
            return { data, error };
        } catch (error) {
            console.error('Get services error:', error);
            return { data: null, error };
        }
    }
    
    // ===== ГАЛЕРЕЯ =====
    async getGallery() {
        if (!this.supabase) return { data: null, error: 'No database' };
        
        try {
            const { data, error } = await this.supabase
                .from('gallery')
                .select('*')
                .order('created_at', { ascending: false });
            
            return { data, error };
        } catch (error) {
            console.error('Get gallery error:', error);
            return { data: null, error };
        }
    }
    
    async addToGallery(photoData) {
        if (!this.supabase) return { error: 'No database' };
        
        try {
            const { data, error } = await this.supabase
                .from('gallery')
                .insert([{
                    title: photoData.title,
                    description: photoData.description,
                    image_url: photoData.imageUrl,
                    category: photoData.category,
                    uploaded_by: photoData.uploadedBy,
                    created_at: new Date().toISOString()
                }])
                .select();
            
            return { data, error };
        } catch (error) {
            console.error('Add to gallery error:', error);
            return { data: null, error };
        }
    }
    
    async deleteFromGallery(photoId) {
        if (!this.supabase) return { error: 'No database' };
        
        try {
            const { data, error } = await this.supabase
                .from('gallery')
                .delete()
                .eq('id', photoId);
            
            return { data, error };
        } catch (error) {
            console.error('Delete from gallery error:', error);
            return { data: null, error };
        }
    }
    
    // Загрузка файла в Supabase Storage
    async uploadFile(file, fileName) {
        if (!this.supabase) return { error: 'No database' };
        
        try {
            const fileExt = fileName.split('.').pop();
            const filePath = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}.${fileExt}`;
            
            const { data, error } = await this.supabase.storage
                .from('gallery')
                .upload(filePath, file);
            
            if (error) throw error;
            
            // Получаем публичный URL
            const { data: { publicUrl } } = this.supabase.storage
                .from('gallery')
                .getPublicUrl(filePath);
            
            return { data: { publicUrl, filePath }, error: null };
        } catch (error) {
            console.error('Upload file error:', error);
            return { data: null, error };
        }
    }
}

// Инициализация базы данных
async function initDatabase() {
    try {
        dbService = new DatabaseService();
        
        const isConnected = await dbService.isConnected();
        
        if (isConnected) {
            console.log('✅ Connected to Supabase');
            document.getElementById('dbStatus').textContent = '✅ Подключено';
            document.getElementById('dbStatus').style.color = 'var(--accent-success)';
            
            if (currentUser) {
                await dbService.saveUser(currentUser);
            }
            
            const { data: dbServices, error } = await dbService.getServices();
            if (!error && dbServices && dbServices.length > 0) {
                servicesData = dbServices.map(s => ({
                    id: s.id,
                    name: s.name,
                    description: s.description || '',
                    price: s.price,
                    duration: s.duration || 60,
                    category: s.category || 'other',
                    icon: s.icon || '💅',
                    popular: s.popular || false
                }));
                console.log(`✅ Loaded ${servicesData.length} services from database`);
            } else {
                loadLocalServices();
            }
            
            if (currentUser) {
                await loadBookingsFromDatabase();
            }
            
            // Загружаем галерею
            await loadGalleryFromDatabase();
        } else {
            console.log('⚠️ Using local storage only');
            document.getElementById('dbStatus').textContent = '❌ Не подключено';
            document.getElementById('dbStatus').style.color = 'var(--accent-danger)';
            loadLocalServices();
        }
        
        renderServices();
        return true;
    } catch (error) {
        console.error('❌ Database init error:', error);
        document.getElementById('dbStatus').textContent = '❌ Ошибка подключения';
        document.getElementById('dbStatus').style.color = 'var(--accent-danger)';
        loadLocalServices();
        renderServices();
        return false;
    }
}

// Синхронизация данных
async function syncDatabase() {
    showLoader();
    try {
        if (dbService && await dbService.isConnected()) {
            const { data: dbServices, error } = await dbService.getServices();
            if (!error && dbServices) {
                servicesData = dbServices.map(s => ({
                    id: s.id,
                    name: s.name,
                    description: s.description || '',
                    price: s.price,
                    duration: s.duration || 60,
                    category: s.category || 'other',
                    icon: s.icon || '💅',
                    popular: s.popular || false
                }));
                renderServices();
            }
            
            if (currentUser) {
                await loadBookingsFromDatabase();
            }
            
            await loadGalleryFromDatabase();
            
            showNotification('✅ Данные синхронизированы с базой', 'success');
        } else {
            showNotification('❌ Нет подключения к базе данных', 'error');
        }
    } catch (error) {
        console.error('Sync error:', error);
        showNotification('❌ Ошибка синхронизации', 'error');
    } finally {
        hideLoader();
    }
}

function renderGallery() {
    const galleryGrid = document.getElementById('galleryGrid');
    if (!galleryGrid) return;
    
    const uploadBtn = document.getElementById('uploadPhotoBtn');
    if (uploadBtn) {
        uploadBtn.style.display = isMasterMode ? 'block' : 'none';
    }
    
    if (galleryItems.length === 0) {
        galleryGrid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:40px;">
                <div style="font-size:48px;color:var(--text-muted);margin-bottom:20px;">🖼️</div>
                <p style="color:var(--text-muted);">Галерея пока пуста</p>
                ${isMasterMode ? '<p style="color:var(--text-muted);font-size:14px;margin-top:10px;">Нажмите "Загрузить работу" чтобы добавить фото</p>' : ''}
            </div>
        `;
        return;
    }
    
    galleryGrid.innerHTML = galleryItems.map(item => `
        <div class="gallery-item" data-category="${item.category}">
            <img src="${item.imageUrl || 'https://via.placeholder.com/400x400?text=Nail+Art'}" 
                 alt="${item.title}"
                 onerror="this.src='https://via.placeholder.com/400x400?text=Nail+Art'">
            ${isMasterMode ? `
                <button class="delete-btn" onclick="deleteGalleryItem('${item.id}')" title="Удалить">
                    <i class="fas fa-trash"></i>
                </button>
            ` : ''}
            <div class="item-info">
                <div style="font-weight:600;font-size:12px;">${item.title}</div>
                ${item.description ? `<div style="font-size:10px;opacity:0.8;margin-top:2px;">${item.description.substring(0, 30)}${item.description.length > 30 ? '...' : ''}</div>` : ''}
            </div>
        </div>
    `).join('');
}

function filterGallery(category) {
    // Убираем активный класс со всех вкладок
    document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
    // Активируем нужную вкладку
    event.target.classList.add('active');
    
    const items = document.querySelectorAll('.gallery-item');
    items.forEach(item => {
        item.style.display = (category === 'all' || item.dataset.category === category) ? 'block' : 'none';
    });
}

function openUploadModal() {
    if (!isMasterMode) {
        showNotification('Только мастер может загружать работы', 'warning');
        return;
    }
    
    document.getElementById('uploadModal').classList.remove('hidden');
    document.getElementById('uploadPreview').style.display = 'none';
    document.getElementById('uploadProgress').style.display = 'none';
    document.getElementById('photoTitle').value = '';
    document.getElementById('photoDescription').value = '';
    document.getElementById('photoCategory').value = 'all';
    selectedPhotoFile = null;
}

function previewPhoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    if (file.size > 5 * 1024 * 1024) {
        showNotification('Файл слишком большой (макс. 5MB)', 'error');
        return;
    }
    
    if (!file.type.match('image.*')) {
        showNotification('Пожалуйста, выберите изображение (JPG, PNG)', 'error');
        return;
    }
    
    selectedPhotoFile = file;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const preview = document.getElementById('uploadPreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        
        const titleInput = document.getElementById('photoTitle');
        if (titleInput && !titleInput.value.trim()) {
            const fileName = file.name.replace(/\.[^/.]+$/, "");
            titleInput.value = fileName.charAt(0).toUpperCase() + fileName.slice(1);
        }
        
        showNotification('Фото выбрано: ' + file.name, 'success');
    };
    
    reader.readAsDataURL(file);
}

async function uploadPhotoToServer() {
    if (!selectedPhotoFile) {
        showNotification('❌ Пожалуйста, сначала выберите фото', 'warning');
        return;
    }
    
    const title = document.getElementById('photoTitle').value.trim();
    if (!title) {
        showNotification('❌ Введите название работы', 'warning');
        return;
    }
    
    const description = document.getElementById('photoDescription').value.trim();
    const category = document.getElementById('photoCategory').value;
    
    if (!dbService || !(await dbService.isConnected())) {
        showNotification('❌ Нет подключения к базе данных', 'error');
        return;
    }
    
    showLoader();
    
    try {
        const progressBar = document.getElementById('uploadProgressBar');
        const progressContainer = document.getElementById('uploadProgress');
        progressContainer.style.display = 'block';
        progressBar.style.width = '10%';
        
        const { data: uploadData, error: uploadError } = await dbService.uploadFile(selectedPhotoFile, selectedPhotoFile.name);
        if (uploadError) throw new Error('Ошибка загрузки файла: ' + uploadError.message);
        
        progressBar.style.width = '50%';
        
        const photoData = {
            title: title,
            description: description,
            imageUrl: uploadData.publicUrl,
            category: category,
            uploadedBy: isMasterMode ? 'master' : (currentUser?.firstName || 'Гость')
        };
        
        const { data: dbData, error: dbError } = await dbService.addToGallery(photoData);
        if (dbError) throw new Error('Ошибка сохранения в базе: ' + dbError.message);
        
        progressBar.style.width = '90%';
        
        if (dbData && dbData[0]) {
            galleryItems.unshift({
                id: dbData[0].id,
                ...photoData,
                createdAt: new Date().toISOString()
            });
        }
        
        progressBar.style.width = '100%';
        
        setTimeout(() => {
            hideLoader();
            closeModal('uploadModal');
            renderGallery();
            showNotification('✅ Фото успешно загружено в галерею!', 'success', 5000);
            
            document.getElementById('photoUpload').value = '';
            document.getElementById('uploadPreview').style.display = 'none';
            document.getElementById('uploadPreview').src = '';
            document.getElementById('photoTitle').value = '';
            document.getElementById('photoDescription').value = '';
            document.getElementById('photoCategory').value = 'all';
            selectedPhotoFile = null;
            progressContainer.style.display = 'none';
            progressBar.style.width = '0%';
            
        }, 1000);
        
    } catch (error) {
        hideLoader();
        console.error('Upload photo error:', error);

        const progressContainer = document.getElementById('uploadProgress');

// ================= НАВИГАЦИЯ =================
function showScreen(screenName) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenName + 'Screen').classList.add('active');
    currentScreen = screenName;
    
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    if (screenName === 'main') document.querySelector('.nav-item:nth-child(1)').classList.add('active');
    else if (screenName === 'booking') document.querySelector('.nav-item:nth-child(2)').classList.add('active');
    else if (screenName === 'services') document.querySelector('.nav-item:nth-child(3)').classList.add('active');
    else if (screenName === 'gallery') document.querySelector('.nav-item:nth-child(4)').classList.add('active');
    else if (screenName === 'profile') document.querySelector('.nav-item:nth-child(5)').classList.add('active');
    
    switch(screenName) {
        case 'myBookings':
            loadUserBookings();
            break;
        case 'booking':
            currentStep = 1;
            updateStepCircles();
            updateNavigationButtons();
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'none';
            break;
        case 'gallery':
            loadGallery();
            break;
        case 'masterPanel':
            refreshMasterPanel();
            break;
        case 'chat':
            initClientChat();
            break;
    }
}

async function refreshMasterPanel() {
    if (!isMasterMode) return;
    
    try {
        let allBookingsData = [];
        let todayBookingsData = [];
        
        if (dbService && await dbService.isConnected()) {
            const [allResult, todayResult] = await Promise.all([
                dbService.getAllBookings(),
                dbService.getTodayBookings()
            ]);
            
            if (allResult.data) allBookingsData = allResult.data;
            if (todayResult.data) todayBookingsData = todayResult.data;
        } else {
            const today = new Date().toISOString().split('T')[0];
            allBookingsData = allBookings;
            todayBookingsData = allBookings.filter(b => b.date === today);
        }
        
        document.getElementById('totalBookings').textContent = allBookingsData.length;
        document.getElementById('todayBookings').textContent = todayBookingsData.length;
        
        const totalRevenue = allBookingsData.reduce((sum, b) => sum + (b.price || 0), 0);
        document.getElementById('totalRevenue').textContent = totalRevenue.toLocaleString('ru-RU') + '₽';
        
        showTodayBookingsInMasterPanel(todayBookingsData);
        
    } catch (error) {
        console.error('Refresh master panel error:', error);
    }
}

function showTodayBookingsInMasterPanel(bookings) {
    const content = document.getElementById('masterContent');
    content.innerHTML = `
        <h4 style="margin-bottom:15px;">📋 Записи на сегодня (${bookings.length})</h4>
        ${bookings.length === 0 ? 
            '<p style="text-align:center;padding:20px;color:var(--text-muted);">Записей на сегодня нет</p>' :
            bookings.map(booking => `
                <div class="card" style="margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                        <div>
                            <div style="font-weight:600;">${booking.service_name || booking.service}</div>
                            <div style="font-size:12px;color:var(--text-muted);">${booking.user_name || booking.userName}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:600;">${booking.time ? booking.time.substring(0, 5) : booking.time}</div>
                            <span class="status-badge status-${booking.status}" onclick="changeBookingStatus('${booking.id}', '${booking.status}')" style="cursor:pointer;">
                                ${booking.status === 'confirmed' ? '✅' : 
                                 booking.status === 'completed' ? '✅' : 
                                 booking.status === 'cancelled' ? '❌' : '⏳'}
                            </span>
                        </div>
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);">
                        📞 ${booking.phone} • 💵 ${booking.price}₽
                        ${booking.notes ? `<br>📝 ${booking.notes.substring(0, 50)}${booking.notes.length > 50 ? '...' : ''}` : ''}
                    </div>
                </div>
            `).join('')
        }
    `;
}

async function changeBookingStatus(bookingId, currentStatus) {
    if (!isMasterMode) return;
    
    const statuses = ['pending', 'confirmed', 'completed', 'cancelled'];
    const currentIndex = statuses.indexOf(currentStatus);
    const nextIndex = (currentIndex + 1) % statuses.length;
    const newStatus = statuses[nextIndex];
    
    try {
        if (dbService && await dbService.isConnected()) {
            await dbService.updateBookingStatus(bookingId, newStatus);
        }
        
        const booking = allBookings.find(b => b.id === bookingId);
        if (booking) {
            booking.status = newStatus;
            saveLocalData();
        }
        
        refreshMasterPanel();
        showNotification(`Статус изменен на: ${newStatus}`, 'success');
        
    } catch (error) {
        console.error('Change status error:', error);
        showNotification('Ошибка при изменении статуса', 'error');
    }
}

function showNotification(message, type = 'info', duration = 5000) {
    const container = document.getElementById('notificationContainer');
    const id = 'notification-' + Date.now();
    
    const notification = document.createElement('div');
    notification.id = id;
    notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--bg-card);
        border-radius: var(--border-radius);
        padding: 16px 20px;
        box-shadow: var(--shadow-lg);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 10000;
        animation: fadeIn 0.3s ease;
        max-width: 400px;
        border-left: 4px solid ${type === 'success' ? 'var(--accent-success)' : type === 'error' ? 'var(--accent-danger)' : type === 'warning' ? 'var(--accent-warning)' : 'var(--accent-info)'};
    `;
    
    notification.innerHTML = `
        <div style="font-size:20px;">
            ${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}
        </div>
        <div style="flex:1;">
            <div style="font-weight:600;">${type === 'success' ? 'Успешно!' : type === 'error' ? 'Ошибка!' : 'Информация'}</div>
            <div style="font-size:14px;margin-top:5px;">${message}</div>
        </div>
        <button class="notification-close" onclick="document.getElementById('${id}').remove()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;">&times;</button>
    `;
    
    container.appendChild(notification);
    
    // Добавляем в список уведомлений
    notifications.push({
        id: Date.now(),
        title: type === 'success' ? 'Успешно' : type === 'error' ? 'Ошибка' : 'Информация',
        message: message,
        type: type,
        createdAt: new Date().toISOString()
    });
    if (notifications.length > 50) notifications.shift();
    saveLocalData();
    updateUI();
    
    setTimeout(() => {
        const element = document.getElementById(id);
        if (element) element.remove();
    }, duration);
}

function loadLocalData() {
    try {
        const savedBookings = localStorage.getItem('nailSakuraBookings');
        if (savedBookings) allBookings = JSON.parse(savedBookings);
        
        const savedNotifications = localStorage.getItem('nailSakuraNotifications');
        if (savedNotifications) notifications = JSON.parse(savedNotifications);
        
    } catch (error) {
        console.error('Load local data error:', error);
    }
}

function saveLocalData() {
    try {
        localStorage.setItem('nailSakuraBookings', JSON.stringify(allBookings));
        localStorage.setItem('nailSakuraNotifications', JSON.stringify(notifications));
    } catch (error) {
        console.error('Save local data error:', error);
    }
}

// Загрузка записей пользователя
async function loadUserBookings(filter = 'all') {
    try {
        if (dbService && currentUser && await dbService.isConnected()) {
            await loadBookingsFromDatabase();
        }
        
        const container = document.getElementById('bookingsList');
        if (!container) return;
        
        let userBookings = allBookings.filter(b => b.userId === currentUser.id);
        const today = new Date().toISOString().split('T')[0];
        if (filter === 'upcoming') {
            userBookings = userBookings.filter(b => b.date >= today && b.status !== 'cancelled');
        } else if (filter === 'past') {
            userBookings = userBookings.filter(b => b.date < today || b.status === 'completed' || b.status === 'cancelled');
        }
        
        if (userBookings.length === 0) {
            container.innerHTML = `
                <div style="text-align:center;padding:40px;">
                    <div style="font-size:48px;color:var(--text-muted);margin-bottom:20px;">📅</div>
                    <p style="color:var(--text-muted);margin-bottom:20px;">У вас пока нет записей</p>
                    <button class="btn btn-primary" onclick="showScreen('booking')">
                        <i class="fas fa-calendar-plus"></i> Записаться
                    </button>
                </div>
            `;
            return;
        }
        
        const sorted = userBookings.sort((a, b) => new Date(a.date) - new Date(b.date));
        
        container.innerHTML = sorted.map(booking => `
            <div class="card" style="margin-bottom:15px;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;">
                    <div>
                        <div style="font-weight:600;font-size:18px;margin-bottom:5px;">${booking.service}</div>
                        <div style="font-size:14px;color:var(--text-muted);">
                            📅 ${formatDate(booking.date)} 🕐 ${booking.time}
                        </div>
                    </div>
                    <span class="status-badge status-${booking.status}">
                        ${booking.status === 'confirmed' ? '✅ Подтверждено' : 
                          booking.status === 'completed' ? '✅ Выполнено' : 
                          booking.status === 'cancelled' ? '❌ Отменено' : '⏳ Ожидание'}
                    </span>
                </div>
                
                <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0;font-size:14px;">
                    <div>
                        <div style="color:var(--text-muted);">Мастер:</div>
                        <div style="font-weight:600;">${booking.master || 'Не указан'}</div>
                    </div>
                    <div>
                        <div style="color:var(--text-muted);">Стоимость:</div>
                        <div style="font-weight:600;color:var(--accent-primary);">${booking.price}₽</div>
                    </div>
                </div>
                
                <div style="display:flex;gap:10px;margin-top:15px;">
                    <button class="btn btn-secondary" onclick="cancelBooking('${booking.id}')" style="flex:1;padding:10px;font-size:14px;" ${booking.status === 'cancelled' || booking.status === 'completed' ? 'disabled' : ''}>
                        <i class="fas fa-times"></i> Отменить
                    </button>
                    <button class="btn btn-primary" onclick="rescheduleBooking('${booking.id}')" style="flex:1;padding:10px;font-size:14px;" ${booking.status === 'cancelled' || booking.status === 'completed' ? 'disabled' : ''}>
                        <i class="fas fa-calendar-alt"></i> Перенести
                    </button>
                </div>
            </div>
        `).join('');
        
    } catch (error) {
        console.error('Load user bookings error:', error);
    }
}

function updateUpcomingBookings() {
    const container = document.getElementById('upcomingBookings');
    if (!container) return;
    
    const today = new Date().toISOString().split('T')[0];
    const upcoming = allBookings
        .filter(b => b.userId === currentUser.id && b.date >= today && b.status !== 'cancelled')
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .slice(0, 3);
    
    if (upcoming.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:20px;">
                <div style="font-size:48px;color:var(--text-muted);margin-bottom:20px;">📅</div>
                <p style="color:var(--text-muted);">У вас пока нет записей</p>
                <button class="btn btn-primary" onclick="showScreen('booking')" style="margin-top:20px;padding:10px 20px;">
                    <i class="fas fa-calendar-plus"></i> Записаться
                </button>
            </div>
        `;
        return;
    }
    
    container.innerHTML = upcoming.map(booking => `
        <div class="card" style="margin-bottom:10px;padding:15px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <div style="font-weight:600;margin-bottom:5px;">${booking.service}</div>
                    <div style="font-size:12px;color:var(--text-muted);">
                        📅 ${formatDate(booking.date)} 🕐 ${booking.time}
                    </div>
                </div>
                <span class="status-badge status-${booking.status}">
                    ${booking.status === 'confirmed' ? '✅' : '⏳'}
                </span>
            </div>
            <div style="margin-top:10px;font-size:12px;color:var(--text-muted);">
                💵 ${booking.price}₽ • 📞 ${booking.phone}

function filterBookings(filter) {
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.toLowerCase().includes(filter === 'all' ? 'все' : filter)) {
            btn.classList.add('active');
        }
    });
    loadUserBookings(filter);

async function cancelBooking(bookingId) {
    if (!confirm('Вы уверены, что хотите отменить запись?')) return;
    showLoader();
    try {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) throw new Error('Запись не найдена');
        if (dbService && await dbService.isConnected()) {
            await dbService.updateBookingStatus(bookingId, 'cancelled');
        }
        booking.status = 'cancelled';
        saveLocalData();
        loadUserBookings();
        updateUpcomingBookings();
        showNotification('Запись отменена', 'success');
    } catch (error) {
        showNotification('Ошибка при отмене записи', 'error');
    } finally {
        hideLoader();
    }
}

    showNotification('Функция переноса записи будет доступна позже', 'info');
}

async function loadClientChatHistory() {
    try {
        if (!dbService) return;
        const { data: messages, error } = await dbService.supabase
            .from('chat_messages')
            .select('*')
            .eq('user_id', currentUser.id.toString())
            .order('created_at', { ascending: true });
        if (!error && messages) {
            chatMessages = messages;
            renderClientChat();
        }
    } catch (error) {
        console.error('Load client chat error:', error);
    }
}

    if (chatMessages.length === 0) {

    container.innerHTML = chatMessages.map(msg => `

            <div style="max-width:80%; background:${msg.sender === 'user' ? 'var(--accent-primary)' : 'var(--bg-card)'};

                       padding:10px 15px; border-radius:15px;
                       border:1px solid rgba(255,182,193,0.2);">

async function loadMasterChats() {
    if (!isMasterMode || !dbService) return;
    showLoader();
    try {
        const { data: messages, error } = await dbService.supabase
            .from('chat_messages')
            .select('user_id, user_name, created_at, text, sender, read')
            .order('created_at', { ascending: false });
        if (error) throw error;
        
        const chatsMap = new Map();
        messages.forEach(msg => {
            if (!chatsMap.has(msg.user_id)) {
                chatsMap.set(msg.user_id, {
                    user_id: msg.user_id,
                    user_name: msg.user_name || 'Клиент',
                    last_message: msg.text,
                    last_message_time: msg.created_at,
                    unread_count: 0,
                    sender: msg.sender
                });
            }
            const chat = chatsMap.get(msg.user_id);
            if (msg.sender === 'user' && !msg.read) {
                chat.unread_count++;
            }
        });
        
        masterChats = Array.from(chatsMap.values())
            .sort((a, b) => new Date(b.last_message_time) - new Date(a.last_message_time));
        
        renderMasterChatsList();
    } catch (error) {
        console.error('Load master chats error:', error);
        showNotification('Ошибка загрузки чатов', 'error');
    } finally {
        hideLoader();
    }
}

function nextStep() {
    console.log('nextStep called, current:', currentStep);
    
    if (currentStep === 1) {
        if (!selectedService) {
            showNotification('❌ Пожалуйста, выберите услугу', 'warning');
            return;
        }
        currentStep = 2;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('step3').style.display = 'none';
        
        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('bookingDate');
        if (dateInput) {
            dateInput.min = today;
            dateInput.value = today;
        }
        
    } else if (currentStep === 2) {
        const date = document.getElementById('bookingDate').value;
        if (!date) {
            showNotification('❌ Пожалуйста, выберите дату', 'warning');
            return;
        }
        
        const selectedDate = new Date(date);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        if (selectedDate < today) {
            showNotification('❌ Нельзя выбрать прошедшую дату', 'warning');
            return;
        }
        
        currentStep = 3;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        updateBookingSummary();
        
    } else if (currentStep === 3) {
        submitBooking();
        return;
    }
    
    updateStepCircles();
    updateNavigationButtons();
}

function prevStep() {
    if (currentStep === 2) {
        currentStep = 1;
        document.getElementById('step1').style.display = 'block';
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'none';
    } else if (currentStep === 3) {
        currentStep = 2;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('step3').style.display = 'none';
    }
    
    updateStepCircles();
    updateNavigationButtons();
}

function updateStepCircles() {
    document.querySelectorAll('.step-circle').forEach((circle, index) => {
        const stepNumber = index + 1;
        if (stepNumber < currentStep) {
            circle.style.background = 'var(--accent-success)';
            circle.innerHTML = '✓';
        } else if (stepNumber === currentStep) {
            circle.style.background = 'var(--accent-primary)';
            circle.innerHTML = stepNumber;
        } else {
            circle.style.background = 'var(--bg-secondary)';
            circle.innerHTML = stepNumber;
        }
    });
}

function updateNavigationButtons() {
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    if (prevBtn) {
        prevBtn.style.display = currentStep > 1 ? 'block' : 'none';
    }
    
    if (nextBtn) {
        if (currentStep === 3) {
            nextBtn.innerHTML = '<i class="fas fa-check"></i> Подтвердить запись';
        } else {
            nextBtn.innerHTML = 'Далее <i class="fas fa-arrow-right"></i>';
        }
    }
}

// ================= ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =================
function escapeHtml(unsafe) {
    return unsafe.replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#039;';
        return m;
    });
}

function formatDate(dateString) {
    const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
    return new Date(dateString).toLocaleDateString('ru-RU', options);
}

function formatTime(dateString) {
    const options = { hour: '2-digit', minute: '2-digit' };
    return new Date(dateString).toLocaleTimeString('ru-RU', options);
}

function formatTimeShort(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diff = now - date;
    if (diff < 24 * 60 * 60 * 1000) {
        return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    } else {
        return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
    }
}
